# Canonical team IDs (slugs of the Football-Data.co.uk name), display names, and aliases.
#
# Aliases cover (a) provider renames found in the raw data and (b) names people are likely
# to type in a round file. Each alias must map to exactly one team; conflicts are errors.
# Reviewed provider renames:
#   2026-27 E1: one row lists "Sheffield Utd" alongside "Sheffield United".
#   2026-27 E2: one row lists "Oxford Utd" alongside "Oxford".
