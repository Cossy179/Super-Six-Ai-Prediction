# Default model and pipeline settings. Changing a value here changes predictions, so the
# whole resolved config is stored with every prediction run.
schema_version: 1
# Promoted from dixon_coles by experiment 002's predeclared rule
# (docs/experiments/2026-11-05-ensemble-market-first.md).
default_model: ensemble

score_grid:
  # Grid grows until the probability mass outside it is below this tolerance.
  tail_tolerance: 1.0e-6
  min_goals: 10
  max_goals: 30

models:
  dixon_coles:
    # Exponential time decay: weight = exp(-xi * age_in_days). 0.0019 ≈ one-year half-life,
    # in line with the per-half-week value reported by Dixon & Coles (1997).
    xi_per_day: 0.0019
    max_history_days: 1095
    # L2 shrinkage of team attack/defence towards zero (helps low-data and promoted teams).
    # Chosen on the 2022-23 VALIDATION season only (xi in {0.001, 0.0019, 0.003} x ridge in
    # {0.5, 2, 8}; scripts/tune_validation.py). Test seasons from 2023-24 were not used.
    ridge: 0.5
    rho_bounds: [-0.2, 0.1]
  poisson:
    xi_per_day: 0.0019
    max_history_days: 1095
    ridge: 0.5
  rolling_goals:
    window: 10
    prior_matches: 3
    max_history_days: 400
  league_average:
    max_history_days: 730
  empirical_score:
    max_history_days: 730
    pseudo_count: 0.5
    max_goals: 10
  market_poisson:
    devig: proportional
  market_dc:
    devig: proportional
  catboost:
    # Not tuned: library-typical settings declared before experiment 003.
    families: [elo, goals, shots, xg, schedule, tier]
    iterations: 600
    depth: 4
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    xi_per_day: 0.001
    max_history_days: 1460
    min_team_matches: 3
    seed: 0
    thread_count: 4
  catboost_market:
    families: [elo, goals, shots, xg, schedule, tier]
    iterations: 600
    depth: 4
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    xi_per_day: 0.001
    max_history_days: 1460
    min_team_matches: 3
    seed: 0
    thread_count: 4
  # Recalibrated CatBoost (experiment 004). Base settings come from the entries above.
  catboost_cal:
    calibration_days: 182
    min_calibration_fixtures: 300
  catboost_market_cal:
    calibration_days: 182
    min_calibration_fixtures: 300
  ensemble:
    team_model: dixon_coles
    # Fitted on the 2022-23 VALIDATION season (scripts/fit_ensemble_weight.py; see
    # docs/experiments/2026-11-05-ensemble-weight-2022-23.txt). Log loss fell steadily as
    # the market weight rose and was best at 1.0, for both an arithmetic mixture and a
    # log-rate blend. In effect: market when pre-cutoff odds exist, team model otherwise.
    market_weight: 1.0
    fitted_on: "2022-07-01/2023-07-01"

golden_goal:
  # uniform: constant scoring rate. empirical: goal-time profile fitted to stored goal
  # minutes (`super6 data goals`) published before the cutoff; falls back to uniform with
  # fewer than 400 goals. Decided by experiment 006.
  profile: uniform
  bin_minutes: 5
  empirical_first_half_stoppage_cells: 3
  empirical_second_half_stoppage_cells: 7
  n_simulations: 50000
  seed: 20261105
  first_half_stoppage_minutes: 2.0
  second_half_stoppage_minutes: 5.0
  half_time_break_minutes: 15.0

backtest:
  refit_every_days: 1
  synthetic_rounds:
    competitions: [E0, E1]
    weekday: 5          # Saturday
    local_kickoff: "15:00"
    fixtures_per_round: 6
    seed: 6
  bootstrap:
    resamples: 2000
    seed: 7
