[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "super6-ai"
version = "0.1.0"
description = "Probabilistic exact-score forecasting and Super 6 decision support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "httpx>=0.27",
    "catboost>=1.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
super6 = "super6.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires SUPER6_TEST_POSTGRES_URL to point at a disposable PostgreSQL database",
    "network: downloads data from the internet",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]
ignore = [
    "RUF001", # en dashes in score strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/unit/test_round_sources.py" = ["E501"]  # synthetic HTML fixtures

[tool.mypy]
python_version = "3.12"
packages = ["super6"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "catboost.*"]
ignore_missing_imports = true
