name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: super6
          POSTGRES_PASSWORD: super6
          POSTGRES_DB: super6_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U super6" --health-interval 5s --health-retries 10
    env:
      SUPER6_TEST_POSTGRES_URL: postgresql+psycopg://super6:super6@localhost:5432/super6_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check src tests scripts migrations
      - name: Type check
        run: mypy
      - name: Tests (unit, leakage, integration, PostgreSQL migrations)
        run: pytest
